# Keeps the free Render API from sleeping during judging by calling its health check every 10 minutes.
# Set the repository variable SPARESLOT_API_URL (Settings > Secrets and variables > Actions > Variables) to the
# API's address, for example https://spareslot-sainadh-api.onrender.com. Disable this workflow after judging.
name: keep-awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the health check
        env:
          API_URL: ${{ vars.SPARESLOT_API_URL || 'https://spareslot-sainadh-api.onrender.com' }}
        run: |
          curl --silent --show-error --retry 5 --retry-delay 20 --retry-all-errors --max-time 90 \
            "$API_URL/actuator/health"
