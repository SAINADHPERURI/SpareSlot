# All secrets and connection details come from the environment (CLAUDE.md rule 9).
spring:
  application:
    name: spareslot
  datasource:
    # DATABASE_URL may be a JDBC URL or a postgres://user:pass@host:port/db URL (see DataSourceConfig)
    url: ${DATABASE_URL:}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    # db/seed holds the fictional demo data (V90+); set SEED_LOCATION to an empty value to leave it out
    locations: classpath:db/migration${SEED_LOCATION:,classpath:db/seed}
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /api/docs

spareslot:
  jwt-secret: ${JWT_SECRET:}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  # The "sign in as" panel on the demo sign-in page. Only accounts whose email ends with this domain qualify.
  demo-login-enabled: ${DEMO_LOGIN_ENABLED:false}
  demo-email-domain: "@demo.spareslot.example"
  # Optional advisory features (cut first). Off means plain fallbacks, never a decision.
  advisory-enabled: ${ADVISORY_ENABLED:false}
  jobs-enabled: ${JOBS_ENABLED:true}
